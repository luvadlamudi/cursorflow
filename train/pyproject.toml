[project]
name = "cursorflow-train"
version = "0.1.0"
description = "Trains the cursorflow model from collected batches."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "psycopg[binary]>=3.1",
]

[project.scripts]
cursorflow-train = "cursorflow_train.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cursorflow_train"]
